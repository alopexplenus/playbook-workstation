---
# Installs the AGENTIC binaries: OpenCode.
# Config is carried by yadm (dotfiles), not here.
# Voice tooling is NOT here — it is not OpenCode-specific; see install_voice.yaml.

- name: check if opencode is installed
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.opencode/bin/opencode"
  register: opencode_bin

- name: install opencode
  ansible.builtin.shell: set -o pipefail; curl -fsSL https://opencode.ai/install | bash
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.opencode/bin/opencode"
  when: not opencode_bin.stat.exists

- name: install pyright (python LSP for opencode)
  # uv is installed in install_core.yaml. uv tool installs into the user's
  # ~/.local/share/uv/tools and symlinks the executable into ~/.local/bin.
  # Runs as the user (NOT become), so opencode can launch pyright-langserver.
  ansible.builtin.command: uv tool install pyright
  args:
    creates: "{{ ansible_env.HOME }}/.local/bin/pyright-langserver"
